[project]
name = "customs-ai-api"
version = "0.1.0"
description = "AI document intake and verification for import shipments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "boto3>=1.34",
    "procrastinate>=3.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "reportlab>=4.0",
    "rapidfuzz>=3.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pgserver>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
