services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: customs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customs-local}
      POSTGRES_DB: customs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-sharing}
      DATABASE_URL: postgresql+psycopg://customs:${POSTGRES_PASSWORD:-customs-local}@db:5432/customs

      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      AI_BACKEND: ${AI_BACKEND:-fixture}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-asia-south1}
      VERTEX_MODEL: ${VERTEX_MODEL:-}

      DEMO_EXEC_PASSWORD: ${DEMO_EXEC_PASSWORD:-demo-exec-2026}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-demo-manager-2026}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/storage
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
